<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Console</title>
    <style>
        :root {
            --bg: #fafafa;
            --panel: #ffffff;
            --border: #dcdcdc;
            --text: #1a1a1a;
            --muted: #737373;
            --accent: #2b5fd9;
            --accent-soft: #eaf0fd;
            --ok: #1a7f37;
            --warn: #b45309;
            --err: #c0392b;
            --radius: 6px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        /* Hide scrollbars everywhere but keep scrolling functional */
        * {
            scrollbar-width: none;
            /* Firefox */
            -ms-overflow-style: none;
            /* old Edge/IE */
        }

        *::-webkit-scrollbar {
            display: none;
            /* Chrome, Safari, new Edge */
            width: 0;
            height: 0;
        }

        body {
            display: flex;
            flex-direction: column;
            background: var(--bg);
            color: var(--text);
            font-size: 14px;
        }

        header {
            flex: none;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
        }

        header h1 {
            font-size: 15px;
            font-weight: 600;
            margin: 0;
            white-space: nowrap;
        }

        header .sub {
            color: var(--muted);
            font-size: 12px;
        }

        header input[type=text] {
            margin-left: auto;
            width: 260px;
            padding: 6px 8px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 12px;
        }

        #status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--muted);
            flex: none;
        }

        #status-dot.ok {
            background: var(--ok);
        }

        #status-dot.err {
            background: var(--err);
        }

        main {
            flex: 1;
            min-height: 0;
            display: grid;
            grid-template-columns: minmax(240px, 300px) minmax(200px, 260px) minmax(320px, 1fr);
            grid-template-rows: minmax(0, 1fr);
        }

        .panel {
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            min-width: 0;
            min-height: 0;
            height: 100%;
            background: var(--panel);
        }

        .panel:last-child {
            border-right: none;
        }

        .panel-head {
            padding: 12px 14px;
            border-bottom: 1px solid var(--border);
        }

        .panel-head h2 {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: .04em;
            color: var(--muted);
            margin: 0 0 8px 0;
        }

        .panel-body {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 8px;
        }

        button {
            font: inherit;
            cursor: pointer;
            border: 1px solid var(--border);
            background: var(--panel);
            border-radius: var(--radius);
            padding: 6px 10px;
            color: var(--text);
        }

        button:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        button:disabled {
            opacity: .5;
            cursor: default;
        }

        button:disabled:hover {
            border-color: var(--border);
            color: var(--text);
        }

        button.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
            width: 100%;
        }

        button.primary:hover {
            opacity: .9;
            color: #fff;
        }

        input[type=file] {
            display: none;
        }

        .doc-card,
        .chat-item {
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 8px 10px;
            margin-bottom: 6px;
            font-size: 12.5px;
        }

        .doc-card .name {
            font-weight: 600;
            word-break: break-all;
            margin-bottom: 4px;
        }

        .doc-meta {
            color: var(--muted);
            font-size: 11px;
            margin-bottom: 6px;
        }

        .badge {
            display: inline-block;
            padding: 1px 7px;
            border-radius: 999px;
            font-size: 10.5px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .02em;
        }

        .badge.ready {
            background: #eee;
            color: var(--muted);
        }

        .badge.analyzing,
        .badge.chunking,
        .badge.embedding {
            background: #fff4e0;
            color: var(--warn);
        }

        .badge.complete {
            background: #e6f6ea;
            color: var(--ok);
        }

        .badge.failed {
            background: #fdeceb;
            color: var(--err);
        }

        .badge.deleted {
            background: #eee;
            color: var(--muted);
        }

        .doc-actions,
        .chat-actions {
            display: flex;
            gap: 6px;
            margin-top: 6px;
            flex-wrap: wrap;
        }

        .doc-actions button,
        .chat-actions button {
            font-size: 11px;
            padding: 3px 8px;
        }

        .chat-item {
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
        }

        .chat-item.active {
            border-color: var(--accent);
            background: var(--accent-soft);
        }

        .chat-item .title {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .chat-item .del {
            border: none;
            background: none;
            color: var(--muted);
            padding: 2px 6px;
        }

        .chat-item .del:hover {
            color: var(--err);
        }

        .empty {
            color: var(--muted);
            font-size: 12px;
            padding: 16px 8px;
            text-align: center;
        }

        /* Active chat panel */
        .chat-view {
            display: flex;
            flex-direction: column;
            height: 100%;
            min-height: 0;
        }

        .chat-view-head {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
        }

        .chat-view-head h2 {
            margin: 0 0 6px 0;
            font-size: 14px;
        }

        .attached-docs {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }

        .chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 3px 6px 3px 10px;
            font-size: 11.5px;
            background: var(--bg);
        }

        .chip button {
            border: none;
            background: none;
            padding: 0 4px;
            color: var(--muted);
            font-size: 13px;
            line-height: 1;
        }

        .chip button:hover {
            color: var(--err);
        }

        .attach-row {
            display: flex;
            gap: 6px;
        }

        .attach-row select {
            flex: 1;
            padding: 5px 6px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 12px;
        }

        .attach-row button {
            font-size: 12px;
        }

        .messages {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .msg {
            max-width: 72%;
            padding: 8px 12px;
            border-radius: var(--radius);
            font-size: 13px;
            line-height: 1.45;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .msg .role {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: .04em;
            opacity: .6;
            margin-bottom: 3px;
            font-weight: 600;
        }

        .msg.USER {
            align-self: flex-end;
            background: var(--accent);
            color: #fff;
        }

        .msg.ASSISTANT {
            align-self: flex-start;
            background: var(--panel);
            border: 1px solid var(--border);
        }

        .msg.SYSTEM {
            align-self: center;
            background: transparent;
            border: 1px dashed var(--border);
            color: var(--muted);
            font-size: 11.5px;
            max-width: 90%;
            text-align: center;
        }

        .composer {
            border-top: 1px solid var(--border);
            padding: 10px 16px;
            display: flex;
            gap: 8px;
        }

        .composer textarea {
            flex: 1;
            min-width: 0;
            resize: none;
            height: 44px;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font: inherit;
        }

        .composer button.primary {
            width: auto;
            flex: none;
            padding: 0 20px;
        }

        .no-chat {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--muted);
            font-size: 13px;
        }

        .thinking {
            align-self: flex-start;
            color: var(--muted);
            font-size: 12px;
            font-style: italic;
            padding: 4px 12px;
        }

        .toast {
            position: fixed;
            bottom: 16px;
            right: 16px;
            background: var(--err);
            color: #fff;
            padding: 10px 14px;
            border-radius: var(--radius);
            font-size: 12.5px;
            max-width: 320px;
            box-shadow: 0 2px 10px rgba(0, 0, 0, .15);
            z-index: 10;
        }
    </style>
</head>

<body>

    <header>
        <span id="status-dot"></span>
        <h1>RAG Console</h1>
        <span class="sub">upload → analyze → attach → chat</span>
        <input id="api-base" type="text" placeholder="http://localhost:8000" value="http://localhost:8000"
            autocomplete="off">
    </header>

    <main>
        <!-- Documents -->
        <section class="panel">
            <div class="panel-head">
                <h2>Documents</h2>
                <button class="primary" id="upload-btn">Upload document</button>
                <input type="file" id="file-input">
            </div>
            <div class="panel-body" id="documents-list">
                <div class="empty">No documents yet</div>
            </div>
        </section>

        <!-- Chats -->
        <section class="panel">
            <div class="panel-head">
                <h2>Chats</h2>
                <button class="primary" id="new-chat-btn">New chat</button>
            </div>
            <div class="panel-body" id="chats-list">
                <div class="empty">No chats yet</div>
            </div>
        </section>

        <!-- Active chat -->
        <section class="panel" id="active-chat-panel">
            <div class="no-chat">Select or create a chat to begin</div>
        </section>
    </main>

    <script>
        (function () {
            const $ = (sel, el = document) => el.querySelector(sel);
            const $$ = (sel, el = document) => Array.from(el.querySelectorAll(sel));

            const state = {
                documents: [],       // {document_id, original_filename, content_type, file_size, created_at, status}
                chats: [],           // {chat_id, title}
                activeChatId: null,
                chatDocuments: [],   // ChatDocumentRead[] for active chat
                messages: [],        // ChatMessageRead[] for active chat
            };

            let msgPollTimer = null;
            let lastMessageCount = 0;

            function apiBase() {
                return $('#api-base').value.replace(/\/+$/, '');
            }

            async function api(path, options = {}) {
                const res = await fetch(apiBase() + path, {
                    headers: options.body instanceof FormData ? {} : { 'Content-Type': 'application/json' },
                    ...options,
                });
                setStatus(true);
                if (res.status === 204) return null;
                let data = null;
                try { data = await res.json(); } catch (_) { /* no body */ }
                if (!res.ok) {
                    const msg = (data && (data.message || data.detail)) || res.statusText;
                    throw new Error(typeof msg === 'string' ? msg : JSON.stringify(msg));
                }
                return data;
            }

            function setStatus(ok) {
                const dot = $('#status-dot');
                dot.classList.remove('ok', 'err');
                dot.classList.add(ok ? 'ok' : 'err');
            }

            function toast(message) {
                const t = document.createElement('div');
                t.className = 'toast';
                t.textContent = message;
                document.body.appendChild(t);
                setTimeout(() => t.remove(), 4000);
            }

            function fmtSize(bytes) {
                if (bytes < 1024) return bytes + ' B';
                if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
                return (bytes / 1024 / 1024).toFixed(1) + ' MB';
            }

            function fmtTime(iso) {
                try {
                    return new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                } catch (_) { return ''; }
            }

            // ---------- Documents ----------

            async function loadDocuments() {
                try {
                    const docs = await api('/documents?page_no=1&page_size=100');
                    state.documents = docs.map(d => ({ ...d, status: state.documents.find(x => x.document_id === d.document_id)?.status || 'ready' }));
                    renderDocuments();
                    renderAttachSelect();
                } catch (e) {
                    toast('Failed to load documents: ' + e.message);
                }
            }

            async function uploadDocument(file) {
                const form = new FormData();
                form.append('file', file);
                try {
                    const doc = await api('/documents/upload', { method: 'POST', body: form });
                    doc.status = 'ready';
                    state.documents.unshift(doc);
                    renderDocuments();
                    renderAttachSelect();
                    analyzeDocument(doc.document_id);
                } catch (e) {
                    toast('Upload failed: ' + e.message);
                }
            }

            async function analyzeDocument(documentId) {
                setDocStatus(documentId, 'analyzing');
                try {
                    const res = await api(`/documents/${documentId}/analysis`, { method: 'POST' });
                    setDocStatus(documentId, res.status || 'analyzing');
                    pollAnalysis(documentId, res.analysis_id);
                } catch (e) {
                    setDocStatus(documentId, 'failed');
                    toast('Analysis failed to start: ' + e.message);
                }
            }

            async function pollAnalysis(documentId, analysisId) {
                const terminal = ['complete', 'failed', 'deleted'];
                const tick = async () => {
                    try {
                        const s = await api(`/analysis/${analysisId}/status`);
                        setDocStatus(documentId, s.status);
                        if (!terminal.includes(s.status)) {
                            setTimeout(tick, 1500);
                        }
                    } catch (e) {
                        // stop polling silently on error
                    }
                };
                tick();
            }

            function setDocStatus(documentId, status) {
                const doc = state.documents.find(d => d.document_id === documentId);
                if (doc) {
                    doc.status = status;
                    renderDocuments();
                }
            }

            async function deleteDocument(documentId) {
                if (!confirm('Delete this document permanently?')) return;
                try {
                    await api(`/documents/${documentId}`, { method: 'DELETE' });
                    state.documents = state.documents.filter(d => d.document_id !== documentId);
                    renderDocuments();
                    renderAttachSelect();
                } catch (e) {
                    toast('Delete failed: ' + e.message);
                }
            }

            function renderDocuments() {
                const el = $('#documents-list');
                if (!state.documents.length) {
                    el.innerHTML = '<div class="empty">No documents yet</div>';
                    return;
                }
                el.innerHTML = state.documents.map(d => `
      <div class="doc-card">
        <div class="name">${escapeHtml(d.original_filename)}</div>
        <div class="doc-meta">${escapeHtml(d.content_type)} · ${fmtSize(d.file_size)}</div>
        <span class="badge ${d.status}">${d.status}</span>
        <div class="doc-actions">
          <button data-action="analyze" data-id="${d.document_id}">Re-analyze</button>
          ${state.activeChatId ? `<button data-action="attach" data-id="${d.document_id}">Attach</button>` : ''}
          <button data-action="delete-doc" data-id="${d.document_id}">Delete</button>
        </div>
      </div>
    `).join('');
            }

            // ---------- Chats ----------

            async function loadChats() {
                try {
                    state.chats = await api('/chats?page_no=1&page_size=100');
                    renderChats();
                    if (!state.activeChatId && state.chats.length) {
                        selectChat(state.chats[0].chat_id);
                    }
                } catch (e) {
                    toast('Failed to load chats: ' + e.message);
                }
            }

            async function createChat() {
                try {
                    const chat = await api('/chats', { method: 'POST', body: JSON.stringify({ title: null }) });
                    state.chats.unshift(chat);
                    renderChats();
                    selectChat(chat.chat_id);
                } catch (e) {
                    toast('Failed to create chat: ' + e.message);
                }
            }

            async function deleteChat(chatId, evt) {
                evt.stopPropagation();
                if (!confirm('Delete this chat?')) return;
                try {
                    await api(`/chats/${chatId}`, { method: 'DELETE' });
                    state.chats = state.chats.filter(c => c.chat_id !== chatId);
                    renderChats();
                    if (state.activeChatId === chatId) {
                        state.activeChatId = null;
                        stopMessagePolling();
                        renderActiveChatEmpty();
                    }
                } catch (e) {
                    toast('Failed to delete chat: ' + e.message);
                }
            }

            function renderChats() {
                const el = $('#chats-list');
                if (!state.chats.length) {
                    el.innerHTML = '<div class="empty">No chats yet</div>';
                    return;
                }
                el.innerHTML = state.chats.map(c => `
      <div class="chat-item ${c.chat_id === state.activeChatId ? 'active' : ''}" data-id="${c.chat_id}">
        <span class="title">${escapeHtml(c.title || 'Untitled chat')}</span>
        <button class="del" data-del="${c.chat_id}" title="Delete chat">&times;</button>
      </div>
    `).join('');
            }

            async function selectChat(chatId) {
                state.activeChatId = chatId;
                lastMessageCount = 0;
                renderChats();
                renderDocuments();
                await Promise.all([loadChatDocuments(chatId), loadMessages(chatId, true)]);
                renderActiveChat();
                startMessagePolling();
            }

            // ---------- Chat documents ----------

            async function loadChatDocuments(chatId) {
                try {
                    state.chatDocuments = await api(`/chats/${chatId}/documents`);
                } catch (e) {
                    state.chatDocuments = [];
                    toast('Failed to load attached documents: ' + e.message);
                }
            }

            async function attachDocument(documentId) {
                if (!state.activeChatId || !documentId) return;
                try {
                    await api(`/chats/${state.activeChatId}/document/${documentId}`, { method: 'POST' });
                    await loadChatDocuments(state.activeChatId);
                    renderActiveChat();
                    renderDocuments();
                } catch (e) {
                    toast('Attach failed: ' + e.message);
                }
            }

            async function detachDocument(documentId) {
                if (!state.activeChatId) return;
                try {
                    await api(`/chats/${state.activeChatId}/document/${documentId}`, { method: 'DELETE' });
                    await loadChatDocuments(state.activeChatId);
                    renderActiveChat();
                } catch (e) {
                    toast('Detach failed: ' + e.message);
                }
            }

            // ---------- Messages ----------

            async function loadMessages(chatId, silent) {
                try {
                    const msgs = await api(`/chats/${chatId}/messages`);
                    const grew = msgs.length !== state.messages.length;
                    state.messages = msgs;
                    if (chatId === state.activeChatId && (grew || !silent)) {
                        renderMessages();
                    }
                } catch (e) {
                    if (!silent) toast('Failed to load messages: ' + e.message);
                }
            }

            function startMessagePolling() {
                stopMessagePolling();
                msgPollTimer = setInterval(() => {
                    if (state.activeChatId) loadMessages(state.activeChatId, true);
                }, 2000);
            }

            function stopMessagePolling() {
                if (msgPollTimer) clearInterval(msgPollTimer);
                msgPollTimer = null;
            }

            async function sendMessage(content) {
                if (!state.activeChatId || !content.trim()) return;
                const chatId = state.activeChatId;
                // optimistic render
                const optimistic = {
                    message_id: 'pending-' + Date.now(),
                    chat_id: chatId,
                    role: 'USER',
                    content,
                    message_metadata: {},
                    created_at: new Date().toISOString(),
                    updated_at: new Date().toISOString(),
                    pending: true,
                };
                state.messages.push(optimistic);
                renderMessages(true);

                try {
                    await api(`/chats/${chatId}/query`, {
                        method: 'POST',
                        body: JSON.stringify({ role: 'USER', content, message_metadata: {} }),
                    });
                    await loadMessages(chatId, true);
                    renderMessages();
                } catch (e) {
                    state.messages = state.messages.filter(m => m.message_id !== optimistic.message_id);
                    renderMessages();
                    toast('Message failed to send: ' + e.message);
                }
            }

            // ---------- Active chat rendering ----------

            function renderActiveChatEmpty() {
                $('#active-chat-panel').innerHTML = '<div class="no-chat">No chat selected — click "New chat" to start one</div>';
            }

            function renderActiveChat() {
                const chat = state.chats.find(c => c.chat_id === state.activeChatId);
                if (!chat) { renderActiveChatEmpty(); return; }

                const attachedIds = new Set(state.chatDocuments.map(d => d.document_id));
                const attachOptions = state.documents.filter(d => !attachedIds.has(d.document_id));

                $('#active-chat-panel').innerHTML = `
      <div class="chat-view">
        <div class="chat-view-head">
          <h2>${escapeHtml(chat.title || 'Untitled chat')}</h2>
          <div class="attached-docs" id="attached-docs">
            ${state.chatDocuments.map(d => `
              <span class="chip">
                ${escapeHtml(d.file_path.split('/').pop())}
                <button data-detach="${d.document_id}" title="Remove from chat">&times;</button>
              </span>
            `).join('') || '<span class="doc-meta">No documents attached</span>'}
          </div>
          <div class="attach-row">
            <select id="attach-select">
              <option value="">Attach a document…</option>
              ${attachOptions.map(d => `<option value="${d.document_id}">${escapeHtml(d.original_filename)}</option>`).join('')}
            </select>
            <button id="attach-go">Attach</button>
          </div>
        </div>
        <div class="messages" id="messages"></div>
        <div class="composer">
          <textarea id="composer-input" placeholder="Ask something about the attached documents…"></textarea>
          <button class="primary" id="send-btn">Send</button>
        </div>
      </div>
    `;
                renderMessages(true);
            }

            function renderMessages(scrollBottom) {
                const el = $('#messages');
                if (!el) return;
                if (!state.messages.length) {
                    el.innerHTML = '<div class="empty">No messages yet — say something below</div>';
                    return;
                }
                el.innerHTML = state.messages.map(m => `
      <div class="msg ${m.role}">
        <div class="role">${m.role.toLowerCase()} · ${fmtTime(m.created_at)}</div>
        <div>${escapeHtml(m.content)}</div>
      </div>
    `).join('');
                if (scrollBottom !== false) el.scrollTop = el.scrollHeight;
            }

            function renderAttachSelect() {
                if (state.activeChatId) renderActiveChat();
            }

            function escapeHtml(str) {
                return String(str ?? '').replace(/[&<>"']/g, c => ({
                    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
                }[c]));
            }

            // ---------- Event wiring ----------

            $('#upload-btn').addEventListener('click', () => $('#file-input').click());
            $('#file-input').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) uploadDocument(file);
                e.target.value = '';
            });

            $('#new-chat-btn').addEventListener('click', createChat);

            $('#documents-list').addEventListener('click', (e) => {
                const btn = e.target.closest('button[data-action]');
                if (!btn) return;
                const id = btn.dataset.id;
                if (btn.dataset.action === 'analyze') analyzeDocument(id);
                if (btn.dataset.action === 'delete-doc') deleteDocument(id);
                if (btn.dataset.action === 'attach') attachDocument(id);
            });

            $('#chats-list').addEventListener('click', (e) => {
                const del = e.target.closest('button[data-del]');
                if (del) { deleteChat(del.dataset.del, e); return; }
                const item = e.target.closest('.chat-item');
                if (item) selectChat(item.dataset.id);
            });

            document.body.addEventListener('click', (e) => {
                if (e.target.id === 'attach-go') {
                    const sel = $('#attach-select');
                    if (sel && sel.value) attachDocument(sel.value);
                }
                if (e.target.closest('button[data-detach]')) {
                    detachDocument(e.target.closest('button[data-detach]').dataset.detach);
                }
                if (e.target.id === 'send-btn') {
                    const input = $('#composer-input');
                    const val = input.value;
                    input.value = '';
                    sendMessage(val);
                }
            });

            document.body.addEventListener('keydown', (e) => {
                if (e.target.id === 'composer-input' && e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    $('#send-btn').click();
                }
            });

            $('#api-base').addEventListener('change', () => {
                loadDocuments();
                loadChats();
            });

            // ---------- Init ----------
            $('#api-base').value = 'http://localhost:8000';
            loadDocuments();
            loadChats();
        })();
    </script>

</body>

</html>
